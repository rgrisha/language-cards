services:

  piper:
    build:
      context: ../../piper
    restart: unless-stopped
    ports:
      - "5000:5000"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/croissantllm/CroissantLLMChat-v0.1-GGUF:Q4_K_M}
    # Auto-pulls on startup (idempotent — cheap local check once cached in the volume).
    # This file is only started when you explicitly want to test Croissant, so no
    # need to gate it behind SENTENCE_PROVIDER like the root docker-compose.yml does.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL" || echo "Failed to pull $$OLLAMA_MODEL, continuing without it"
        wait

volumes:
  ollama-data:

