spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:language_cards}
    username: ${DB_USER:language_cards}
    password: ${DB_PASSWORD:language_cards}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  audio-path: ${AUDIO_PATH:/data/audio}
  piper:
    base-url: ${PIPER_BASE_URL:http://piper:5000}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  buffer:
    target-sentences-per-word: ${BUFFER_SIZE:10}
    batch-per-tick: ${BUFFER_BATCH:3}
  card:
    cooldown: ${CARD_COOLDOWN:50}

logging:
  level:
    com.languagecards: INFO
