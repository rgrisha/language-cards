spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/language_cards
    username: ${DB_USER:language_cards}
    password: ${DB_PASSWORD:language_cards}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: ${CONTEXT_PATH:}

app:
  audio-path: ${AUDIO_PATH:/data/audio}
  sentence-provider: ${SENTENCE_PROVIDER:claude} # claude | croissant
  piper:
    base-url: ${PIPER_BASE_URL:http://piper:5000}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    model: ${OLLAMA_MODEL:hf.co/croissantllm/CroissantLLMChat-v0.1-GGUF:Q4_K_M}
  sentence-translation-provider: ${SENTENCE_TRANSLATION_PROVIDER:croissant} # croissant | google-unofficial
  google-translate:
    base-url: ${GOOGLE_TRANSLATE_BASE_URL:https://translate.googleapis.com}
  buffer:
    target-sentences-per-word: ${BUFFER_SIZE:10}
    batch-per-tick: ${BUFFER_BATCH:3}
  card:
    cooldown: ${CARD_COOLDOWN:50}

logging:
  level:
    com.languagecards: INFO
