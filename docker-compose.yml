services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  piper:
    #build:
    #  context: ./piper
    image: ${IMAGE_NAMESPACE:-local}/language-cards-piper:latest
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      SENTENCE_PROVIDER: ${SENTENCE_PROVIDER:-claude}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/croissantllm/CroissantLLMChat-v0.1-GGUF:Q4_K_M}
    volumes:
      - ollama-data:/root/.ollama
    # Auto-pulls the model on startup, but only when SENTENCE_PROVIDER=croissant —
    # otherwise Claude-only users pay no cost for this service being present.
    # ollama pull is idempotent: once cached in the ollama-data volume, later
    # restarts just do a quick local check instead of re-downloading.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        if [ "$$SENTENCE_PROVIDER" = "croissant" ]; then
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull "$$OLLAMA_MODEL" || echo "Failed to pull $$OLLAMA_MODEL, continuing without it"
        fi
        wait

  language-cards-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE_NAMESPACE:-local}/language-cards-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piper:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: language_cards
      DB_USER: language_cards
      DB_PASSWORD: ${LANGUAGE_CARDS_DB_PASSWORD}
      PIPER_BASE_URL: http://piper:5000
      SENTENCE_PROVIDER: ${SENTENCE_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/croissantllm/CroissantLLMChat-v0.1-GGUF:Q4_K_M}
      AUDIO_PATH: /data/audio
    volumes:
      - language-audio-data:/data/audio


volumes:
  postgres-data:
  	driver: local
  language-audio-data:
  	driver: local
  ollama-data:
  	driver: local

