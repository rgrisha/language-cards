services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-language_cards}
      POSTGRES_USER: ${POSTGRES_USER:-language_cards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-language_cards}"]
      interval: 5s
      timeout: 5s
      retries: 10

  piper:
    build:
      context: ./piper
    image: ${IMAGE_NAMESPACE:-language-cards}-piper:latest
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE_NAMESPACE:-language-cards}-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piper:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-language_cards}
      DB_USER: ${POSTGRES_USER:-language_cards}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PIPER_BASE_URL: http://piper:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      AUDIO_PATH: /data/audio
    volumes:
      - audio-data:/data/audio
    ports:
      - "${HOST_PORT:-8080}:8080"

volumes:
  postgres-data:
  audio-data:
